name: Skill bundles
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  bundles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - run: python scripts/check_bundles.py
      - run: python -m unittest discover -s tests -v
